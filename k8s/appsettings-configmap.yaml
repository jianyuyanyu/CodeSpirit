apiVersion: v1
kind: ConfigMap
metadata:
  name: config-appsettings
  namespace: code-spirit
data:
  appsettings.json: |
    {
      "Logging": {
        "LogLevel": {
          "Default": "Information",
          "Microsoft.AspNetCore": "Warning"
        }
      },
      "ConnectionStrings": {
        "cache": "redis:6379,defaultDatabase=0,abortConnect=false,connectTimeout=5000,syncTimeout=5000"
      },
      "Jwt": {
        "SecretKey": "ECBF8FA013844D77AE041A6800D7FF8F",
        "Issuer": "codespirit.com",
        "Audience": "CodeSpirit"
      },
      "Aspire": {
        "Seq": {
          "DisableHealthChecks": true,
          "ServerUrl": "http://seq:5341"
        },
        "RabbitMQ": {
          "Client": {
            "ConnectionString": "amqp://admin:Password123@rabbitmq:5672",
            "DisableHealthChecks": true,
            "DisableTracing": true,
            "ExchangeName": "codespirit_event_bus"
          }
        }
      },
      "AllowedHosts": "*",
      "OTEL_EXPORTER_OTLP_ENDPOINT": "http://aspire-dashboard:18889"
    } 