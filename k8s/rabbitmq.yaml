apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: code-spirit-release
  labels:
    k8s-app: rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels:
      k8s-app: rabbitmq
  template:
    metadata:
      labels:
        k8s-app: rabbitmq
    spec:
      containers:
      - name: rabbitmq
        image: rabbitmq:3.8-management-alpine
        env:
        - name: RABBITMQ_DEFAULT_USER
          value: admin
        - name: RABBITMQ_DEFAULT_PASS
          value: Password123
        resources:
          requests:
            cpu: 10m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: code-spirit-release
  labels:
    k8s-app: rabbitmq
spec:
  type: NodePort
  ports:
  - port: 15672
    targetPort: 15672
    name: management
  - port: 5672
    targetPort: 5672
    name: amqp
  selector:
    k8s-app: rabbitmq
